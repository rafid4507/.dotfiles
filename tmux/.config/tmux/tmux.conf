# tmux — terminal multiplexer (Catppuccin Mocha)
# tmux reads this file from ~/.config/tmux/tmux.conf (tmux >= 3.1)
# Reload inside tmux with:  <prefix> r

# ── Prefix: Ctrl-a (Ctrl-b stays available too) ──────────────────────────────
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

# ── General ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
setw -g mode-keys vi
set -sg repeat-time 600
set -g display-time 4000

# ── Splits open in the current directory ─────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Vim-style pane navigation ────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Reload / config ──────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# ── Status bar (Catppuccin Mocha) ────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#cba6f7] "
set -g status-right "#[fg=#89b4fa]#(whoami) #[fg=#45475a]| #[fg=#a6e3a1]#H #[fg=#45475a]| #[fg=#f9e2af]%H:%M #[fg=#cba6f7]"

# ── Windows ──────────────────────────────────────────────────────────────────
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W "
setw -g window-status-separator      ""
setw -g window-status-current-style  "bg=#313244,fg=#cba6f7"

# ── Panes ────────────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-status off

# ── Messages / command prompt ────────────────────────────────────────────────
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g clock-mode-colour "#cba6f7"
