# btop — resource monitor (Catppuccin Mocha)
# btop rewrites this file when you change settings in-app, so keep edits here.
# Full option list: `btop --help` and the btop wiki.

#? Config version (do not edit)
config_version = 6

color_theme = "catppuccin_mocha"
theme_background = True
truecolor = True
rounded_corners = True

update_ms = 1000
proc_sorting = "cpu lazy"
proc_tree = False
show_uptime = True
check_temp = False

# Preset graphs
preset = "cpu:1:default,proc:0:default"

shown_boxes = "cpu mem net proc"
