# Extra Yazi keybindings, layered on top of the shipped defaults.
# https://yazi-rs.github.io/docs/configuration/keymap

# Drop into a shell in the current directory.
[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block'
desc = "Open a shell here"

# Jump to the root of the current Git repository.
[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to Git repository root"
