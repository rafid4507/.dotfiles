# starship — cross-shell prompt (Catppuccin Mocha)
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

format = """
[](#cba6f7)\
[](#b4befe)\
[](#89b4fa)\
[](#94e2d5)\
[](#a6e3a1)\
[](#f9e2af)\
[](#fab387)\
[](#f38ba8)\
[](#f5c2e7)\
[](#cba6f7)$os$username$hostname$directory$git_branch$git_status$python$nodejs$rust$golang$docker_context$cmd_duration$line_break$character"""

[os]
disabled = false
style = "bg:#cba6f7 fg:#11111b"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = " "
Linux = " "

[username]
show_always = true
style_user = "bg:#b4befe fg:#11111b"
style_root = "bg:#f38ba8 fg:#11111b"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "bg:#89b4fa fg:#11111b"
format = "[ $hostname ]($style)"

[directory]
style = "bg:#94e2d5 fg:#11111b"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#a6e3a1 fg:#11111b"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#f9e2af fg:#11111b"
format = "[$all_status$ahead_behind ]($style)"

[cmd_duration]
min_time = 2000
style = "bg:#fab387 fg:#11111b"
format = "[  $duration ]($style)"

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"
vimcmd_symbol = "[❮](bold #89b4fa)"

[python]
style = "bg:#f9e2af fg:#11111b"
format = "[ $symbol$version ]($style)"
symbol = " "

[nodejs]
style = "bg:#a6e3a1 fg:#11111b"
format = "[ $symbol$version ]($style)"
symbol = " "

[rust]
style = "bg:#fab387 fg:#11111b"
format = "[ $symbol$version ]($style)"
symbol = " "

[golang]
style = "bg:#89dceb fg:#11111b"
format = "[ $symbol$version ]($style)"
symbol = " "

[docker_context]
style = "bg:#89b4fa fg:#11111b"
format = "[ $symbol$context ]($style)"
symbol = " "
