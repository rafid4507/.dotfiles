# yazi theme — Catppuccin Mocha
# Docs: https://yazi-rs.github.io/docs/configuration/theme

[manager]
cwd = { fg = "#cba6f7" }
hovered = { fg = "#1e1e2e", bg = "#89b4fa" }
preview_hovered = { underline = true }
find_keyword = { fg = "#f9e2af", bold = true }
find_position = { fg = "#f5c2e7" }
marker_selected = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_copied = { fg = "#f9e2af", bg = "#f9e2af" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
count_copied = { fg = "#1e1e2e", bg = "#f9e2af" }
count_cut = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#a6e3a1" }
border_symbol = "│"
border_style = { fg = "#585b70" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#585b70" }
progress_label = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#313244" }
progress_error = { fg = "#f38ba8", bg = "#313244" }
perm_type = { fg = "#89b4fa" }
perm_read = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6e3a1" }
perm_selected = { fg = "#1e1e2e" }

[select]
border = { fg = "#cba6f7" }
active = { fg = "#cba6f7" }
inactive = { fg = "#6c7086" }

[input]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7" }
value = { fg = "#cdd6f4" }
selected = { bg = "#313244" }

[tasks]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7" }
hovered = { fg = "#1e1e2e", bg = "#89b4fa" }
header = { fg = "#cdd6f4" }

[which]
mask = { bg = "#313244" }
cand = { fg = "#89dceb" }
rest = { fg = "#cdd6f4" }
desc = { fg = "#a6adc8" }
separator = "  "
separator_style = { fg = "#585b70" }

[help]
on = { fg = "#cba6f7" }
run = { fg = "#89b4fa" }
desc = { fg = "#cdd6f4" }
hovered = { bg = "#313244", bold = true }
footer = { fg = "#cdd6f4", bg = "#313244" }
