# fuzzel — application launcher (Catppuccin Mocha)
# Docs: https://codeberg.org/dnkl/fuzzel  (man fuzzel.ini)
# Colours are RRGGBBAA hex.

[main]
font=JetBrainsMono Nerd Font:size=11
prompt="  "
terminal=kitty
layer=overlay
width=42
lines=10
tabs=4
horizontal-pad=18
vertical-pad=14
inner-pad=10
icon-theme=Papirus
icons-enabled=yes
show-actions=yes
match-mode=fzf
dmenu-mode=text

[colors]
background=1e1e2ef2
text=cdd6f4ff
prompt=89b4faff
placeholder=6c7086ff
input=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=6c7086ff
border=cba6f7ff

[border]
width=2
radius=12
